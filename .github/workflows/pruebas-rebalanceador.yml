name: Pruebas aisladas del rebalanceador
on:
  push:
    branches:
      - feature/rebalanceador-aportes-seguro
  pull_request:
    branches:
      - audit/firebase-firestore-seguridad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-sinteticas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regresiones y rebalanceador (sin Firebase real)
        run: node --test tests/regression.test.cjs tests/rebalanceador.test.cjs tests/rebalanceador.integration.test.cjs

  firestore-emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-racional-security-tests
      FIREBASE_CLI_EXPERIMENTS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias de pruebas en entorno efímero
        run: npm install --no-save --no-package-lock firebase@12 @firebase/rules-unit-testing@5 firebase-tools@14
      - name: Probar reglas solo con emulador y proyecto demo
        run: ./node_modules/.bin/firebase emulators:exec --project demo-racional-security-tests --only firestore "node --test tests/firestore-security.test.cjs"
