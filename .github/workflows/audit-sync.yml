name: Auditoría de sincronización y reglas
on:
  push:
    branches: ['audit/sincronizacion-respaldo-seguro']
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm test
      - run: npm run test:security